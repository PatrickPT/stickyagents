# PR checks. No secrets. Each step runs one target of the Makefile, which holds the commands.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Lint (ruff, pinned)
        run: |
          pip install --quiet ruff==0.17.2
          make lint RUFF=ruff
      - name: Tests (standard library only)
        run: make test
