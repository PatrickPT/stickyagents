# Secret scan: gitleaks over every commit of each PR and of the default branch, with the rules in .gitleaks.toml.
# A finding names the rule and the place, never the value. It scans .git with the ignore path elsewhere, so a
# .gitleaksignore counts nowhere (gitleaks reads one from both places).
name: secrets
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, not only the last commit
      - name: gitleaks 8.30.1, checked against its SHA-256
        run: |
          f=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -m 120 -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$f" | sha256sum -c --quiet
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Secrets in any commit (rules in .gitleaks.toml)
        run: >-
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts=HEAD --ignore-gitleaks-allow
          --gitleaks-ignore-path "$RUNNER_TEMP" --redact --verbose --no-banner --no-color .git
