name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real session records, report output with private paths, or credentials.
        Describe the problem with invented paths and commands, or attach a synthetic fixture.
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: The command you ran
      placeholder: stickyagents report --json
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and its version
      placeholder: Claude Code 2.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: Python 3.12, Ubuntu 24.04
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not pasted real session records, private paths or credentials.
          required: true
