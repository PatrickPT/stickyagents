# Keeps the workflow actions, which are pinned to commit SHAs, current: Dependabot opens a PR when a pinned
# action has a new release, and moves the SHA and its version comment together. The Python side has no
# dependencies to watch (pyproject.toml lists none; the lint tool is pinned in the Makefile and the workflow).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
